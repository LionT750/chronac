spring.application.name=chronac
server.port=8080

# CORS: allow the Vite dev server (npm run dev) to call /api cross-origin.
# Same-origin calls from the embedded static UI on :8080 do not need this.
# Consumed by WebCorsConfig (comma-separated list).
chronac.cors.allowed-origins=${CHRONAC_CORS_ORIGINS:http://localhost:5173}

# GET /api/timetable serves a solve with a PINNED random seed, so the demo shows
# the same timetable on every restart - a pitch needs a schedule you can talk
# through, not whatever the last run happened to find. Defaults come from
# TimetableGenerator; override either to try another run without recompiling.
# chronac.demo.seed=1
# chronac.demo.seconds=90
# chronac.demo.unimproved-seconds=25

# Applies to the auto-configured SolverManager, which the demo no longer uses
# (TimetableGenerator builds its own seeded solver). Kept so the starter has a
# termination configured.
timefold.solver.termination.spent-limit=60s