spring.application.name=chronac
server.port=8080

# CORS: allow the Vite dev server (npm run dev) to call /api cross-origin.
# Same-origin calls from the embedded static UI on :8080 do not need this.
# Consumed by WebCorsConfig (comma-separated list).
chronac.cors.allowed-origins=${CHRONAC_CORS_ORIGINS:http://localhost:5173}

# Faithful to the legacy main(): Timefold solves the demo problem for 60 seconds.
# Returns the best solution found in that time after the application starts.
timefold.solver.termination.spent-limit=60s